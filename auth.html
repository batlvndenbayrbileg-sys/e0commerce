<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Nitec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand" style="justify-content:center;display:flex">
      <span class="brand-mark">N</span><span>nitec.</span>
    </a>

    <div style="display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:var(--r-pill);margin:24px 0 28px">
      <button data-auth-tab="login" class="btn btn-sm active" style="flex:1;justify-content:center;background:#fff;box-shadow:var(--shadow-xs)">Sign in</button>
      <button data-auth-tab="register" class="btn btn-sm" style="flex:1;justify-content:center;background:transparent">Create account</button>
    </div>

    <!-- LOGIN -->
    <form data-auth-form="login" onsubmit="event.preventDefault();location.href='account.html'">
      <h2 class="h2" style="margin-bottom:6px;font-size:28px">Welcome back.</h2>
      <p class="muted" style="margin-bottom:24px">Sign in to track orders and access your wishlist.</p>

      <div class="field" style="margin-bottom:12px">
        <label>Email</label>
        <input type="email" required placeholder="you@email.com" />
      </div>
      <div class="field" style="margin-bottom:8px">
        <label>Password</label>
        <input type="password" required placeholder="••••••••" />
      </div>
      <div class="between" style="margin-bottom:18px">
        <label class="checkbox-row" style="padding:0;font-size:13px"><input type="checkbox" /> Remember me</label>
        <a href="#" class="tiny" style="text-decoration:underline">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-dark" style="width:100%;justify-content:center;height:52px">
        Sign in
        <span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
      </button>

      <div class="divider">or continue with</div>

      <div class="social-row">
        <button type="button" class="btn">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 11.1H12v3.8h5.35c-.23 1.3-1.4 3.8-5.35 3.8-3.2 0-5.8-2.65-5.8-5.9s2.6-5.9 5.8-5.9c1.8 0 3.05.78 3.75 1.45l2.55-2.45C16.7 4.5 14.55 3.5 12 3.5c-4.7 0-8.5 3.8-8.5 8.5s3.8 8.5 8.5 8.5c4.9 0 8.15-3.45 8.15-8.3 0-.55-.05-.95-.15-1.1z"/></svg>
          Google
        </button>
        <button type="button" class="btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 1.5c0 1.2-.5 2.3-1.3 3.1-.9.9-2 1.5-3.2 1.4-.1-1.2.5-2.4 1.3-3.2.9-.9 2.2-1.4 3.2-1.3zM20 17.5c-.6 1.4-1.3 2.7-2.3 3.9-1 1.1-2.1 2.1-3.6 2.1s-1.9-.9-3.6-.9c-1.7 0-2.2.9-3.6.9-1.5 0-2.7-1.1-3.7-2.2-2.1-2.4-3.7-6.9-1.5-9.9 1.1-1.5 3-2.5 5-2.5 1.5 0 2.9.9 3.8.9.9 0 2.6-1.1 4.4-.9.7 0 2.9.3 4.3 2.3-.1.1-2.6 1.5-2.5 4.4 0 3.4 3 4.5 3 4.5z"/></svg>
          Apple
        </button>
      </div>

      <p class="tiny" style="text-align:center;margin-top:24px">
        New to Nitec? <a data-auth-tab="register" style="cursor:pointer;text-decoration:underline">Create an account</a>
      </p>
    </form>

    <!-- REGISTER -->
    <form data-auth-form="register" style="display:none" onsubmit="event.preventDefault();location.href='account.html'">
      <h2 class="h2" style="margin-bottom:6px;font-size:28px">Create account.</h2>
      <p class="muted" style="margin-bottom:24px">Join Nitec — early drops and free shipping over $300.</p>

      <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div class="field"><label>First name</label><input required /></div>
        <div class="field"><label>Last name</label><input required /></div>
      </div>
      <div class="field" style="margin-bottom:12px">
        <label>Email</label>
        <input type="email" required placeholder="you@email.com" />
      </div>
      <div class="field" style="margin-bottom:16px">
        <label>Password</label>
        <input type="password" required placeholder="At least 8 characters" />
      </div>

      <label class="checkbox-row" style="padding:0;font-size:13px;margin-bottom:18px">
        <input type="checkbox" required /> I agree to the <a href="#" style="text-decoration:underline">Terms</a> & <a href="#" style="text-decoration:underline">Privacy</a>
      </label>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;height:52px">
        Create account
        <span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
      </button>

      <div class="divider">or sign up with</div>

      <div class="social-row">
        <button type="button" class="btn">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 11.1H12v3.8h5.35c-.23 1.3-1.4 3.8-5.35 3.8-3.2 0-5.8-2.65-5.8-5.9s2.6-5.9 5.8-5.9c1.8 0 3.05.78 3.75 1.45l2.55-2.45C16.7 4.5 14.55 3.5 12 3.5c-4.7 0-8.5 3.8-8.5 8.5s3.8 8.5 8.5 8.5c4.9 0 8.15-3.45 8.15-8.3 0-.55-.05-.95-.15-1.1z"/></svg>
          Google
        </button>
        <button type="button" class="btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 1.5c0 1.2-.5 2.3-1.3 3.1-.9.9-2 1.5-3.2 1.4-.1-1.2.5-2.4 1.3-3.2.9-.9 2.2-1.4 3.2-1.3zM20 17.5c-.6 1.4-1.3 2.7-2.3 3.9-1 1.1-2.1 2.1-3.6 2.1s-1.9-.9-3.6-.9c-1.7 0-2.2.9-3.6.9-1.5 0-2.7-1.1-3.7-2.2-2.1-2.4-3.7-6.9-1.5-9.9 1.1-1.5 3-2.5 5-2.5 1.5 0 2.9.9 3.8.9.9 0 2.6-1.1 4.4-.9.7 0 2.9.3 4.3 2.3-.1.1-2.6 1.5-2.5 4.4 0 3.4 3 4.5 3 4.5z"/></svg>
          Apple
        </button>
      </div>

      <p class="tiny" style="text-align:center;margin-top:24px">
        Already have an account? <a data-auth-tab="login" style="cursor:pointer;text-decoration:underline">Sign in</a>
      </p>
    </form>
  </div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
