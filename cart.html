<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart — Nitec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<div class="shell">
  <div class="shell-frame">
    <nav class="nav">
      <a href="index.html" class="brand"><span class="brand-mark">N</span><span>nitec.</span></a>
      <div class="nav-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Search…" /><span class="kbd">⌘K</span>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="shop.html">Shop</a>
        <a class="nav-link" href="shop.html">New</a>
        <a class="nav-link" href="shop.html">Sale</a>
      </div>
      <div class="row" style="gap:8px">
        <button class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
        <a class="icon-btn active" href="cart.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/></svg><span class="dot"></span></a>
        <a href="account.html" class="avatar-chip">Ryman Alex <span class="avatar">RA</span></a>
      </div>
    </nav>
  </div>
</div>

<main>
  <section class="page-head">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a><span class="sep">/</span><span>Cart</span></div>
      <h1 class="h1" style="margin-top:8px">Your bag.</h1>
      <p class="muted" style="margin-top:8px">Review your selection — change quantities or remove anything before checkout.</p>
    </div>
  </section>

  <section style="padding:0 0 100px">
    <div class="container">
      <div class="cart-layout">
        <div class="cart-list" id="cart-list"></div>

        <aside class="cart-summary" id="cart-summary">
          <h3 class="h3">Order summary</h3>
          <div class="sum-row"><span>Subtotal</span><span data-sub>$0</span></div>
          <div class="sum-row"><span>Shipping</span><span data-ship>Free</span></div>
          <div class="sum-row"><span>Tax (est.)</span><span data-tax>$0</span></div>

          <div class="coupon">
            <input placeholder="Promo code" />
            <button class="btn btn-ghost btn-sm">Apply</button>
          </div>

          <div class="sum-row total"><span>Total</span><span data-total>$0</span></div>

          <a href="checkout.html" class="btn btn-dark" style="width:100%;justify-content:center;margin-top:14px">
            Checkout
            <span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
          </a>

          <div style="margin-top:18px;padding:14px;border-radius:var(--r-md);background:var(--surface-2);font-size:13px;color:var(--text-secondary);text-align:center">
            🚚 Free shipping on orders over $300
          </div>
        </aside>
      </div>

      <!-- Cross sell -->
      <section style="margin-top:80px">
        <h2 class="h2" style="margin-bottom:24px">Frequently bought together</h2>
        <div class="product-grid" id="related"></div>
      </section>
    </div>
  </section>
</main>

<nav class="mob-tabbar">
  <a href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</a>
  <a href="shop.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Shop</a>
  <a href="cart.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/></svg>Cart</a>
  <a href="account.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</a>
</nav>

<div class="toast" id="toast"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 5 5L20 7"/></svg><span id="toast-msg">Added</span></div>
<script src="assets/js/app.js"></script>
</body>
</html>
