<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order placed — Nitec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card" style="max-width:560px;text-align:center">
    <div class="brand"><span class="brand-mark">N</span><span>nitec.</span></div>

    <div style="margin:32px auto;width:88px;height:88px;border-radius:50%;background:var(--brand-lime);display:grid;place-items:center;animation:pop 600ms cubic-bezier(.34,1.56,.64,1)">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#0A0A0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
    </div>
    <style>@keyframes pop { from { transform: scale(.4); opacity:0 } to { transform: scale(1); opacity:1 } }</style>

    <h1 class="h2" style="margin-bottom:10px">Order placed.</h1>
    <p class="muted">A confirmation has been sent to your email. We've started packing — you'll receive tracking within 24 hours.</p>

    <div style="background:var(--surface-2);border-radius:var(--r-md);padding:20px;margin:28px 0;text-align:left">
      <div class="between" style="margin-bottom:6px"><span class="tiny">Order number</span><span style="font-family:var(--font-mono);font-weight:600">#NT‑284901</span></div>
      <div class="between" style="margin-bottom:6px"><span class="tiny">Estimated delivery</span><span style="font-weight:500">Jun 22 — Jun 24</span></div>
      <div class="between"><span class="tiny">Tracked via</span><span style="font-weight:500">DHL Express</span></div>
    </div>

    <div class="row" style="justify-content:center;gap:10px">
      <a href="account.html" class="btn btn-dark">View order</a>
      <a href="index.html" class="btn btn-ghost">Continue shopping</a>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
